<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- light theme: paper oklch(0.985 0.006 269), ink oklch(0.22 0.02 269) -->
  <style>
    .line-1 {
      stroke-dasharray: 12;
      stroke-dashoffset: 12;
      animation: type-1 4s ease-in-out infinite;
    }
    .line-2 {
      stroke-dasharray: 8;
      stroke-dashoffset: 8;
      animation: type-2 4s ease-in-out infinite;
    }
    .line-3 {
      stroke-dasharray: 10;
      stroke-dashoffset: 10;
      animation: type-3 4s ease-in-out infinite;
    }
    .dot {
      transform-origin: 22px 20px;
      animation: pop-dot 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    @keyframes type-1 {
      0%, 10% { stroke-dashoffset: 12; }
      25%, 85% { stroke-dashoffset: 0; }
      92%, 100% { stroke-dashoffset: 12; }
    }
    @keyframes type-2 {
      0%, 25% { stroke-dashoffset: 8; }
      40%, 85% { stroke-dashoffset: 0; }
      92%, 100% { stroke-dashoffset: 8; }
    }
    @keyframes type-3 {
      0%, 40% { stroke-dashoffset: 10; }
      55%, 85% { stroke-dashoffset: 0; }
      92%, 100% { stroke-dashoffset: 10; }
    }
    @keyframes pop-dot {
      0%, 55% {
        transform: scale(0);
        opacity: 0;
      }
      62% {
        transform: scale(1.4);
        opacity: 1;
      }
      68%, 85% {
        transform: scale(1);
        opacity: 1;
      }
      92%, 100% {
        transform: scale(0);
        opacity: 0;
      }
    }
  </style>

  <path class="line-1" d="M10 12h12" stroke="#2e2e42" stroke-width="2" stroke-linecap="round"/>
  <path class="line-2" d="M10 16h8" stroke="#2e2e42" stroke-width="2" stroke-linecap="round"/>
  <path class="line-3" d="M10 20h10" stroke="#2e2e42" stroke-width="2" stroke-linecap="round"/>

  <circle class="dot" cx="22" cy="20" r="2" fill="#2e2e42"/>
</svg>
