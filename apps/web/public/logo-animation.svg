<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Solid eclipse">
  <style>
    .mark { transform-box: fill-box; transform-origin: center; animation: settle 1.8s ease-in-out infinite; }
    .dot { transform-box: fill-box; transform-origin: center; animation: dot-pulse 1.8s ease-in-out infinite; }
    @keyframes settle { 0%, 100% { transform: scale(.96); } 50% { transform: scale(1); } }
    @keyframes dot-pulse { 0%, 100% { transform: scale(.9); opacity: .75; } 50% { transform: scale(1); opacity: 1; } }
  </style>
  <defs>
    <mask id="bite">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="46" cy="20" r="9" fill="#000"/>
    </mask>
  </defs>
  <circle class="mark" cx="32" cy="32" r="20" fill="oklch(1 0 0)" mask="url(#bite)"/>
  <circle class="dot" cx="46" cy="20" r="3.2" fill="oklch(0.58 0.21 260.84)"/>
</svg>
