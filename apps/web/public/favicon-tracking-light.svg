<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- light theme: paper oklch(0.985 0.006 269), ink oklch(0.22 0.02 269)  tracking pulse -->
  <style>
    .pulse {
      transform-origin: 22px 20px;
      animation: tracking-pulse 1.2s ease-in-out infinite;
    }
    @keyframes tracking-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.7; }
    }
  </style>
  <path d="M10 12h12M10 16h8M10 20h10" stroke="#2e2e42" stroke-width="2" stroke-linecap="round"/>
  <circle class="pulse" cx="22" cy="20" r="2" fill="#2e2e42"/>
</svg>
