<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Solid eclipse">
  <style>
    .pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: tracking-pulse 1.2s ease-in-out infinite;
    }
    @keyframes tracking-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.7; }
    }
  </style>
  <defs>
    <mask id="bite">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="46" cy="20" r="9" fill="#000"/>
    </mask>
  </defs>
  <circle cx="32" cy="32" r="20" fill="#f4f4f5" mask="url(#bite)"/>
  <circle class="pulse" cx="46" cy="20" r="3.2" fill="#8b8be8"/>
</svg>
