<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="oklch(0.15 0.02 269.18)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orch</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("orch-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) {
            icon.href = theme === "light" ? "/favicon-light.svg" : "/favicon.svg";
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.content = theme === "light" ? "oklch(0.985 0.006 269)" : "oklch(0.15 0.02 269.18)";
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
